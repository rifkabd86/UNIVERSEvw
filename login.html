{% extends 'base.html' %}

{% block title %}Login - TemplateVerse{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <a href="{{ url_for('index') }}" class="navbar-brand justify-content-center mb-2 fs-2">
                            <i class="fa-solid fa-cubes-stack"></i> TemplateVerse
                        </a>
                        <h4 class="mt-3 font-poppins text-dark">Selamat Datang Kembali!</h4>
                        <p class="text-muted small">Silakan masuk menggunakan akun Anda untuk mengelola dan membeli template.</p>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username atau Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" class="form-control bg-light border-start-0 ps-0" id="username" name="username" placeholder="Masukkan username atau email" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label for="password" class="form-label mb-0">Password</label>
                                <a href="#" class="text-decoration-none small">Lupa password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="Masukkan password" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check d-flex justify-content-between">
                            <div>
                                <input type="checkbox" class="form-check-input" id="remember_me">
                                <label class="form-check-label small text-muted" for="remember_me">Ingat saya</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-grad w-100 py-2.5 fs-6 mb-3">Masuk Sekarang</button>
                    </form>

                    <div class="text-center">
                        <p class="text-muted small mb-0">Belum punya akun? <a href="{{ url_for('register') }}" class="text-decoration-none font-weight-600">Daftar sekarang</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
